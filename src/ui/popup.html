<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kalm</title>
    <link rel="stylesheet" href="theme.css" />
    <script src="../comments/settings.js"></script>
    <script type="module" src="popup.mjs"></script>
  </head>
  <body class="popup">
    <header class="row">
      <div class="brand"><img src="assets/logo.svg" alt="" /><span>Kalm</span></div>
      <span class="hostname muted" id="hostname">Connecting…</span>
    </header>
    <main>
      <section class="section" id="mode-section">
        <div class="row">
          <h2>Filtering</h2>
          <output id="mode-name" class="mode">—</output>
        </div>
        <input
          id="mode"
          class="range"
          type="range"
          min="0"
          max="3"
          step="1"
          value="2"
          aria-label="Filtering level for this website"
          disabled
        />
        <div class="ticks" aria-hidden="true">
          <span>Off</span><span>Basic</span><span>Optimal</span><span>Complete</span>
        </div>
      </section>
      <section class="section">
        <button class="setup row" id="ad-setup">
          <span>Ad blocking</span><span class="chevron" aria-hidden="true">↗</span>
        </button>
      </section>
      <section class="section row">
        <label class="switch"
          ><span>YouTube comments</span
          ><input
            id="comments-enabled"
            type="checkbox"
            role="switch"
            aria-label="YouTube comment filter"
            disabled /></label
        ><button class="icon" id="comment-setup" aria-label="Comment filter setup">⚙</button>
      </section>
    </main>
    <a
      class="donate"
      href="https://kalm-support.pages.dev/"
      target="_blank"
      rel="noopener noreferrer"
      >Donate</a
    >
    <div id="status" class="status" role="status"></div>
    <footer>
      <span id="connection">Connecting</span
      ><a href="options.html?section=about" id="about">About</a>
    </footer>
  </body>
</html>
