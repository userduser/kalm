name: Bug report
description: Report a reproducible filtering or browser failure
body:
  - type: input
    id: environment
    attributes:
      label: Kalm version, browser version and OS
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected behavior and actual behavior
      description: Include install method and a minimal public example. Exclude private browsing, cookies and credentials.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation or minimal diagnostics
